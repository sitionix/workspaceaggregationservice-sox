environment: localhost
server:
  port: 9082
  servlet:
    context-path: /wagssox
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/WAGS_SOX}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres-pwd}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:wagssox-sitemeta}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
forge:
  inbox:
    domain-store: POSTGRES
  security:
    service-id: sitionixWorkspace
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET}
      issuer: sitionix-internal
      ttl-seconds: 300
    policies:
      sitionixBff:
        allow:
          - "*"
    server:
      excludes:
        - "/actuator/health"
        - "/actuator/health/readiness"
        - "/actuator/health/liveness"
